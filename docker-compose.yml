services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-kubesage}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kubesage}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-kubesage_vector}
      POSTGRES_USER: ${PGVECTOR_USER:-kubesage}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-kubesage}
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles:
      - local-observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.3.2
    profiles:
      - local-observability
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-13100}:3100"
    volumes:
      - loki_data:/loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  kubesage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${KUBESAGE_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KUBESAGE_SERVER_AUTH_TOKEN: ${KUBESAGE_AUTH_TOKEN:-}

      KUBESAGE_REDIS_ENABLED: "true"
      KUBESAGE_REDIS_ADDRESS: redis:6379
      KUBESAGE_REDIS_PASSWORD: ${REDIS_PASSWORD:-kubesage}

      KUBESAGE_PROMETHEUS_BASE_URL: ${KUBESAGE_PROMETHEUS_BASE_URL:-http://host.docker.internal:9091}
      KUBESAGE_LOKI_ENABLED: "true"
      KUBESAGE_LOKI_BASE_URL: ${KUBESAGE_LOKI_BASE_URL:-http://host.docker.internal:3102}
      KUBESAGE_OTEL_ENABLED: "true"
      KUBESAGE_OTEL_EXPORTER: otlphttp
      KUBESAGE_OTEL_ENDPOINT: otel-collector:4318
      KUBESAGE_OTEL_INSECURE: "true"

      KUBESAGE_RAG_VECTOR_STORE: pgvector
      KUBESAGE_RAG_PGVECTOR_DSN: postgres://${PGVECTOR_USER:-kubesage}:${PGVECTOR_PASSWORD:-kubesage}@pgvector:5432/${PGVECTOR_DATABASE:-kubesage_vector}?sslmode=disable
      KUBESAGE_RAG_PGVECTOR_TABLE: ${PGVECTOR_TABLE:-runbook_vectors}
      KUBESAGE_RAG_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      KUBESAGE_RAG_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      KUBESAGE_RAG_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KUBESAGE_RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      KUBESAGE_RAG_EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}

      KUBESAGE_LLM_ENABLED: ${LLM_ENABLED:-false}
      KUBESAGE_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      KUBESAGE_LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data:
  prometheus_data:
  loki_data:
