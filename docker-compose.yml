version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: kubesage
      MYSQL_USER: kubesage
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-kubesage}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kubesage}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  kubesage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Use environment variables for sensitive config (not in config file)
      KUBESAGE_SERVER_AUTH_TOKEN: ${KUBESAGE_AUTH_TOKEN:-}
      KUBESAGE_MYSQL_HOST: mysql
      KUBESAGE_MYSQL_PORT: "3306"
      KUBESAGE_MYSQL_USERNAME: kubesage
      KUBESAGE_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kubesage}
      KUBESAGE_MYSQL_DATABASE: kubesage
      KUBESAGE_REDIS_ENABLED: "true"
      KUBESAGE_REDIS_ADDRESS: redis:6379
      KUBESAGE_REDIS_PASSWORD: ${REDIS_PASSWORD:-kubesage}
      KUBESAGE_RAG_VECTOR_STORE: qdrant
      KUBESAGE_RAG_QDRANT_BASE_URL: http://qdrant:6333
      KUBESAGE_RAG_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      KUBESAGE_RAG_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KUBESAGE_LLM_ENABLED: "true"
      KUBESAGE_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      KUBESAGE_LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

secrets:
  mysql_root_password:
    environment: MYSQL_ROOT_PASSWORD
  mysql_password:
    environment: MYSQL_PASSWORD

volumes:
  mysql_data:
  qdrant_data:
