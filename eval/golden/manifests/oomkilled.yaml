apiVersion: v1
kind: Pod
metadata:
  name: oomkilled
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "allocating memory until OOMKilled"
          x=""
          while true; do
            x="${x}$(head -c 1048576 /dev/zero | base64)"
            sleep 0.1
          done
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 32Mi
          cpu: 200m
