cases:
  - id: oom-limit-too-low
    name: OOMKilled from low memory limit
    fixture: ../fixtures/oom-limit-too-low.json
    tags: [oomkilled, memory]
    max_duration_seconds: 5
    golden_answer:
      expected_fault_type: OOMKilled
      root_cause: OOMKilled exitCode 137 memory limit out of memory
      key_evidences:
        - reason=OOMKilled
        - exitCode=137
        - memoryLimit=128Mi
        - out of memory
      should_not_contain: [CrashLoopBackOff, ImagePullBackOff, NodeNotReady, DNS]
      acceptable_remediations: [memory limit, previous logs]
      confidence_min: 0.82

