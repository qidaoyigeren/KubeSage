                      print("GET /healthz returned 404 because route is /readyz", flush=True)
                      self.send_response(404)
                      self.end_headers()
                      self.wfile.write(b'not found')
              HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          image: python:3.12-alpine
          name: app
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
                path: /healthz
                port: 8080
                scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
    restartPolicy: Always
