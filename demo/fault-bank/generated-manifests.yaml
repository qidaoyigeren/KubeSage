apiVersion: v1
kind: Pod
metadata:
    annotations:
        kubesage.io/expected-fault: ProbeFailed
        kubesage.io/offline-case: eval/cases/fault-bank.yaml
        kubesage.io/root-cause: readiness probe failed timeout slow startup initialDelaySeconds
    labels:
        app: bank-probe-slow-startup
        kubesage.io/case-id: bank-probe-slow-startup
        kubesage.io/demo-surface: pod
        kubesage.io/fault-bank: "true"
        kubesage.io/fault-type: probefailed
    name: bank-probe-slow-startup
    namespace: eval-bank
spec:
    containers:
        - command:
            - python
            - -c
            - |
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      print("startup still warming cache; health timeout before service became ready", flush=True)
                      time.sleep(10)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b'ok')
              HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          image: python:3.12-alpine
          name: app
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
                path: /ready
                port: 8080
                scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            httpGet:
                path: /startup
                port: 8080
                scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
    restartPolicy: Always
