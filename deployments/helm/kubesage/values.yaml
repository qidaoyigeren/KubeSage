# KubeSage Helm Values
# IMPORTANT: For production, override sensitive values via:
#   1. Kubernetes Secrets (recommended)
#   2. --set flags: helm install --set config.mysql.password=xxx
#   3. Environment variables with KUBESAGE_ prefix
# NEVER commit real credentials to version control.

replicaCount: 1

image:
  repository: kubesage
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

config:
  server:
    authToken: ""
  auth:
    mode: bearer
  mysql:
    dsn: ""
    host: mysql
    port: 3306
    username: kubesage
    password: kubesage
    database: kubesage
    readReplicas: []
    maxIdleConns: 10
    maxOpenConns: 50
    connMaxLifetimeSeconds: 3600
  kubernetes:
    kubeconfig: ""
  diagnosis:
    taskTimeoutSeconds: 60
    podLockTTLSeconds: 300
  agent:
    enabled: true
    maxSteps: 12
    toolTimeoutSeconds: 10
  planner:
    type: llm
  queue:
    type: ""
    stream: kubesage:diagnosis
    group: kubesage-workers
    consumer: worker-1
    maxRetry: 3
    retryDelaySeconds: 5
    drainTimeoutSeconds: 30
  retention:
    taskDays: 30
  prometheus:
    baseURL: ""
  llm:
    enabled: false
    baseURL: https://api.deepseek.com
    apiKey: ""
    model: deepseek-chat
    grounding:
      enabled: true
      semanticMinOverlap: 0.3
      passRiskThreshold: 0.2
      warningRiskThreshold: 0.3
      rejectRiskThreshold: 0.4
  mcp:
    enabled: false
    servers: []
  loki:
    enabled: false
    baseURL: ""
    tenantID: ""
  redis:
    enabled: false
    mode: single
    address: redis:6379
    addresses: []
    password: ""
    username: ""
    db: 0
    sentinelMaster: ""
    sentinelUsername: ""
    sentinelPassword: ""
  rag:
    vectorStore: ""
    preferVector: false
    embedding:
      provider: ""
      baseURL: ""
      apiKey: ""
      model: ""
      dimension: 1536
    qdrant:
      baseURL: ""
      apiKey: ""
      collection: kubesage_runbooks
    pgvector:
      dsn: ""
      table: runbook_vectors
  notification:
    slackWebhookURL: ""
    feishuWebhookURL: ""
    dingTalkWebhookURL: ""
    alertmanagerWriteback: false
  otel:
    enabled: false
    exporter: stdout
    endpoint: ""
    insecure: true

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
