apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubesage.fullname" . }}
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout_seconds: 15
      write_timeout_seconds: 30
      auth_token: ""
    auth:
      mode: {{ .Values.config.auth.mode | quote }}
    mysql:
      dsn: {{ .Values.config.mysql.dsn | quote }}
      host: {{ .Values.config.mysql.host | quote }}
      port: {{ .Values.config.mysql.port }}
      username: {{ .Values.config.mysql.username | quote }}
      password: ""
      database: {{ .Values.config.mysql.database | quote }}
      charset: "utf8mb4"
      parse_time: true
      loc: "Local"
      read_replicas:
{{ toYaml .Values.config.mysql.readReplicas | indent 8 }}
      max_idle_conns: {{ .Values.config.mysql.maxIdleConns }}
      max_open_conns: {{ .Values.config.mysql.maxOpenConns }}
      conn_max_lifetime_seconds: {{ .Values.config.mysql.connMaxLifetimeSeconds }}
    kubernetes:
      kubeconfig: {{ .Values.config.kubernetes.kubeconfig | quote }}
      request_timeout_seconds: 15
      default_log_tail_lines: 200
    diagnosis:
      task_timeout_seconds: {{ .Values.config.diagnosis.taskTimeoutSeconds }}
      log_window_before_seconds: 120
      log_window_after_seconds: 60
      pod_lock_ttl_seconds: {{ .Values.config.diagnosis.podLockTTLSeconds }}
      retry_max_attempts: 2
      retry_initial_backoff_ms: 100
      retry_max_backoff_ms: 1000
    agent:
      enabled: {{ .Values.config.agent.enabled }}
      max_steps: {{ .Values.config.agent.maxSteps }}
      tool_timeout_seconds: {{ .Values.config.agent.toolTimeoutSeconds }}
      enable_dry_run_preview: true
      hypothesis_config_path: ""
    planner:
      type: {{ .Values.config.planner.type | quote }}
    queue:
      type: {{ .Values.config.queue.type | quote }}
      stream: {{ .Values.config.queue.stream | quote }}
      group: {{ .Values.config.queue.group | quote }}
      consumer: {{ .Values.config.queue.consumer | quote }}
      max_retry: {{ .Values.config.queue.maxRetry }}
      retry_delay_seconds: {{ .Values.config.queue.retryDelaySeconds }}
      blocking_seconds: 5
      drain_timeout_seconds: {{ .Values.config.queue.drainTimeoutSeconds }}
    retention:
      task_days: {{ .Values.config.retention.taskDays }}
    prometheus:
      base_url: {{ .Values.config.prometheus.baseURL | quote }}
      timeout_seconds: 10
      retry_max_attempts: 2
      retry_initial_backoff_ms: 100
      retry_max_backoff_ms: 1000
    llm:
      enabled: {{ .Values.config.llm.enabled }}
      base_url: {{ .Values.config.llm.baseURL | quote }}
      api_key: ""
      model: {{ .Values.config.llm.model | quote }}
      retry_max_attempts: 2
      retry_initial_backoff_ms: 200
      retry_max_backoff_ms: 2000
      grounding:
        enabled: {{ .Values.config.llm.grounding.enabled }}
        semantic_min_overlap: {{ .Values.config.llm.grounding.semanticMinOverlap }}
        pass_risk_threshold: {{ .Values.config.llm.grounding.passRiskThreshold }}
        warning_risk_threshold: {{ .Values.config.llm.grounding.warningRiskThreshold }}
        reject_risk_threshold: {{ .Values.config.llm.grounding.rejectRiskThreshold }}
    loki:
      enabled: {{ .Values.config.loki.enabled }}
      base_url: {{ .Values.config.loki.baseURL | quote }}
      tenant_id: {{ .Values.config.loki.tenantID | quote }}
      timeout_seconds: 10
    redis:
      enabled: {{ .Values.config.redis.enabled }}
      mode: {{ .Values.config.redis.mode | quote }}
      address: {{ .Values.config.redis.address | quote }}
      addresses:
{{ toYaml .Values.config.redis.addresses | indent 8 }}
      password: ""
      username: {{ .Values.config.redis.username | quote }}
      db: {{ .Values.config.redis.db }}
      key_prefix: "kubesage"
      sentinel_master: {{ .Values.config.redis.sentinelMaster | quote }}
      sentinel_username: {{ .Values.config.redis.sentinelUsername | quote }}
      sentinel_password: ""
    otel:
      enabled: {{ .Values.config.otel.enabled }}
      service_name: "kubesage"
      exporter: {{ .Values.config.otel.exporter | quote }}
      endpoint: {{ .Values.config.otel.endpoint | quote }}
      insecure: {{ .Values.config.otel.insecure }}
    migrations:
      enabled: true
      dir: "./migrations"
    runbook:
      dir: "./runbooks"
    rag:
      vector_store: {{ .Values.config.rag.vectorStore | quote }}
      prefer_vector: {{ .Values.config.rag.preferVector }}
      embedding:
        provider: {{ .Values.config.rag.embedding.provider | quote }}
        base_url: {{ .Values.config.rag.embedding.baseURL | quote }}
        api_key: ""
        model: {{ .Values.config.rag.embedding.model | quote }}
        dimension: {{ .Values.config.rag.embedding.dimension }}
      qdrant:
        base_url: {{ .Values.config.rag.qdrant.baseURL | quote }}
        api_key: ""
        collection: {{ .Values.config.rag.qdrant.collection | quote }}
      pgvector:
        dsn: ""
        table: {{ .Values.config.rag.pgvector.table | quote }}
    notification:
      slack_webhook_url: ""
      feishu_webhook_url: ""
      dingtalk_webhook_url: ""
      alertmanager_writeback: {{ .Values.config.notification.alertmanagerWriteback }}
    log:
      level: "info"
      development: false
