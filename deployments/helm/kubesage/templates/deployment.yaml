apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubesage.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "kubesage.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubesage.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubesage.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "kubesage.serviceAccountName" . }}
      containers:
        - name: kubesage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUBESAGE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubesage.fullname" . }}
                  key: mysql-password
            - name: KUBESAGE_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubesage.fullname" . }}
                  key: llm-api-key
            - name: KUBESAGE_SERVER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubesage.fullname" . }}
                  key: auth-token
            - name: KUBESAGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubesage.fullname" . }}
                  key: redis-password
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kubesage.fullname" . }}
