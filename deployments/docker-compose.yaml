services:
  mysql:
    profiles:
      - mysql
    image: mysql:8.4
    container_name: kubesage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kubesage
      MYSQL_USER: kubesage
      MYSQL_PASSWORD: kubesage
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - kubesage-mysql-data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kubesage-mysql-data:
