server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  # SENSITIVE: Set via KUBESAGE_SERVER_AUTH_TOKEN env var
  auth_token: ""

auth:
  mode: "bearer"
  default_role: "operator"
  viewer_tokens: []
  operator_tokens: []
  admin_tokens: []
  allowed_namespaces: []

mysql:
  dsn: ""
  host: "127.0.0.1"
  port: 3306
  username: "kubesage"
  # SENSITIVE: Set via KUBESAGE_MYSQL_PASSWORD env var
  password: ""
  database: "kubesage"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  read_replicas: []
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime_seconds: 3600

kubernetes:
  kubeconfig: "~/.kube/config"
  request_timeout_seconds: 15
  default_log_tail_lines: 200

diagnosis:
  task_timeout_seconds: 60
  log_window_before_seconds: 120
  log_window_after_seconds: 60
  pod_lock_ttl_seconds: 300
  retry_max_attempts: 2
  retry_initial_backoff_ms: 100
  retry_max_backoff_ms: 1000

agent:
  enabled: true
  max_steps: 12
  tool_timeout_seconds: 10
  enable_dry_run_preview: true
  hypothesis_config_path: ""

# Planner type: "llm" (default, uses LLM when available with rule-based fallback)
# or "rule" (always use deterministic rule-based planning)
planner:
  type: "llm"

queue:
  type: ""
  stream: "kubesage:diagnosis"
  group: "kubesage-workers"
  consumer: "worker-1"
  max_retry: 3
  retry_delay_seconds: 5
  blocking_seconds: 5
  drain_timeout_seconds: 30

retention:
  task_days: 30

prometheus:
  base_url: ""
  timeout_seconds: 10
  retry_max_attempts: 2
  retry_initial_backoff_ms: 100
  retry_max_backoff_ms: 1000

llm:
  enabled: false
  base_url: "https://api.deepseek.com"
  # SENSITIVE: Set via KUBESAGE_LLM_API_KEY env var
  api_key: ""
  model: "deepseek-chat"
  retry_max_attempts: 2
  retry_initial_backoff_ms: 200
  retry_max_backoff_ms: 2000

# MCP (Model Context Protocol) tools: connect to external MCP-compatible servers
# to extend the agent's toolset (e.g., Grafana, PostgreSQL, custom tools).
mcp:
  enabled: false
  servers: []
  # Example:
  # servers:
  #   - name: "grafana"
  #     command: "npx"
  #     args: ["-y", "@grafana/mcp-server"]
  #     timeout_seconds: 30

loki:
  enabled: false
  base_url: ""
  tenant_id: ""
  timeout_seconds: 10

redis:
  enabled: false
  mode: "single"
  address: "127.0.0.1:6379"
  addresses: []
  # SENSITIVE: Set via KUBESAGE_REDIS_PASSWORD env var
  password: ""
  username: ""
  db: 0
  key_prefix: "kubesage"
  sentinel_master: ""
  sentinel_username: ""
  # SENSITIVE: Set via KUBESAGE_REDIS_SENTINEL_PASSWORD env var
  sentinel_password: ""

otel:
  enabled: false
  service_name: "kubesage"
  exporter: "stdout"
  endpoint: ""
  insecure: true

migrations:
  enabled: true
  dir: "./migrations"

runbook:
  dir: "./runbooks"

rag:
  vector_store: ""
  prefer_vector: false
  embedding:
    provider: ""
    base_url: ""
    # SENSITIVE: Set via KUBESAGE_RAG_EMBEDDING_API_KEY env var
    api_key: ""
    model: ""
  qdrant:
    base_url: ""
    # SENSITIVE: Set via KUBESAGE_RAG_QDRANT_API_KEY env var
    api_key: ""
    collection: "kubesage_runbooks"

notification:
  slack_webhook_url: ""
  feishu_webhook_url: ""
  dingtalk_webhook_url: ""
  alertmanager_writeback: false

log:
  level: "info"
  development: true
