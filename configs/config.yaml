server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_seconds: 15
  write_timeout_seconds: 30

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "kubesage"
  password: "kubesage"
  database: "kubesage"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"

kubernetes:
  kubeconfig: "~/.kube/config"
  request_timeout_seconds: 15
  default_log_tail_lines: 200

diagnosis:
  task_timeout_seconds: 60
  log_window_before_seconds: 120
  log_window_after_seconds: 60

prometheus:
  base_url: ""
  timeout_seconds: 10

loki:
  address: ""
  timeout_seconds: 10

runbook:
  dir: "./runbooks"

log:
  level: "info"
  development: true
